<!-- Main layout container with Cream background -->
<div class="min-h-screen flex bg-[#FDFBF7] font-sans selection:bg-[#4A3B32] selection:text-white">
  
  <!-- Left side: Aesthetic Coffee Image (Hidden on mobile, visible on large screens) -->
  <div 
    class="bg-[url('/images/cafe-login.jpg')] hidden lg:block lg:w-1/2 bg-cover bg-center relative">
    <!-- Optional overlay for better integration -->
    <div class="absolute inset-0 bg-black/10"></div>
    <!-- Simple text overlay on image -->
    <div class="absolute bottom-12 left-12 text-white">
      <h1 class="text-4xl font-bold mb-2 drop-shadow-md">Crafting Moments</h1>
      <p class="text-lg opacity-90 drop-shadow-md">One perfect cup at a time.</p>
    </div>
  </div>
  <!-- Right side: Login Form Container -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24">
    
    <!-- Form wrapper matching the provided structure but enhanced with Tailwind -->
    <div class="login-container w-full max-w-md">
      
      <!-- Header section -->
      <div class="mb-10 text-center lg:text-left flex flex-col items-center lg:items-start">
        <!-- Decorative Coffee Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-[#4A3B32] mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
          <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
          <line x1="6" y1="2" x2="6" y2="4"></line>
          <line x1="10" y1="2" x2="10" y2="4"></line>
          <line x1="14" y1="2" x2="14" y2="4"></line>
        </svg>
        <h2 class="text-3xl font-bold text-[#2A211D] mb-2 tracking-tight">Byurens Cafe POS</h2>
        <p class="text-[#8B7355] text-sm font-medium">Please sign in to access your dashboard</p>
      </div>
      
      <!-- The Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Email Field -->
        <div class="form-group flex flex-col space-y-2">
          <label for="email" class="text-sm font-bold text-[#4A3B32]">Email</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="barista@byurens.com"
            class="px-4 py-3 rounded-xl border-2 border-[#E8DCCB] bg-white text-[#2A211D] placeholder:text-[#BBA891] focus:outline-none focus:ring-0 focus:border-[#4A3B32] transition-all duration-200"
            [class.border-red-400]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
        </div>
        <!-- Password Field -->
        <div class="form-group flex flex-col space-y-2">
          <div class="flex justify-between items-center">
            <label for="password" class="text-sm font-bold text-[#4A3B32]">Password</label>
            <a href="#" class="text-xs font-semibold text-[#8B7355] hover:text-[#4A3B32] transition-colors duration-200">Forgot password?</a>
          </div>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            class="px-4 py-3 rounded-xl border-2 border-[#E8DCCB] bg-white text-[#2A211D] placeholder:text-[#BBA891] focus:outline-none focus:ring-0 focus:border-[#4A3B32] transition-all duration-200"
            [class.border-red-400]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
        </div>
        <!-- Error Alert using Control Flow -->
        @if (errorMessage()) {
          <div class="error-alert flex items-start p-4 rounded-xl bg-[#FFF6F6] text-[#D93025] text-sm border-l-4 border-[#D93025]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ errorMessage() }}</span>
          </div>
        }
        <!-- Submit Button -->
        <button type="submit" 
                [disabled]="loginForm.invalid || isSubmitting()"
                class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl text-white font-bold bg-[#4A3B32] hover:bg-[#2A211D] focus:outline-none focus:ring-4 focus:ring-[#E8DCCB] disabled:opacity-60 disabled:hover:bg-[#4A3B32] disabled:cursor-not-allowed transition-all duration-200 shadow-lg shadow-[#4A3B32]/20">
          @if (isSubmitting()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Authenticating...
          } @else {
            Sign In
          }
        </button>
        
      </form>
      
      <div class="mt-8 text-center text-sm text-[#8B7355]">
        <p>&copy; 2026 Byurens Cafe. All rights reserved.</p>
      </div>
    </div>
  </div>
</div>
